[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serbot-agv-simulator"
version = "0.2.0"
description = "Local 3D SerBot AGV simulator with virtual children, camera frames, and a Python control API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
training = ["gymnasium>=1.0,<2", "numpy>=1.26"]

[project.scripts]
serbot-sim = "simulator.server:main"

[tool.setuptools]
packages = ["simulator", "simulator.examples"]

[tool.setuptools.package-data]
simulator = ["models/friendly_referee_v1.json", "static/*.html", "static/*.css", "static/*.js", "static/sounds/*.wav", "static/vendor/*"]
