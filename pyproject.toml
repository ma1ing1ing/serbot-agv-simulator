[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serbot-agv-simulator"
version = "0.1.0"
description = "Local 3D SerBot AGV simulator with virtual children, camera frames, and a Python control API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
serbot-sim = "simulator.server:main"

[tool.setuptools]
packages = ["simulator", "simulator.examples"]

[tool.setuptools.package-data]
simulator = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]
